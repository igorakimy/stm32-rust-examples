[package]
name = "adc"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
cortex-m = {
    version = "0.7.7",
    features = ["critical-section-single-core"]
}
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
embassy-stm32 = {
    version = "0.6.0",
    features = ["stm32f446re", "unstable-pac", "time-driver-any", "exti"]
}
embassy-executor = {
    version = "0.10.0",
    features = ["platform-cortex-m", "executor-thread", "executor-interrupt"]
}
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
heapless = "0.8"
panic-halt = "1.0.0"
embassy-futures = "0.1.2"

[[bin]]
name = "adc"
test = false
bench = false

[profile.dev]
lto = true
opt-level = "s"

[package.metadata.renode]
name = "adc"
description = "renode script that shows how to work with adc"
machine-name = "NUCLEO-F446RE"
using-sysbus = true
renode = "renode"
platform-descriptions = [
    "../../files/nucleo-f446re.repl",
]
pre-start-commands = [
    "showAnalyzer sysbus.usart2",
    "machine StartGdbServer 3333",
]
