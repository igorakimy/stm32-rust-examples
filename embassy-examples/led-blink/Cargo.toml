[package]
name = "led-blink"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = {
    version = "0.7.7",
    features = ["critical-section-single-core"]
}
cortex-m-rt = "0.7.5"
embassy-stm32 = {
    version = "0.6.0",
    features = ["stm32f446re", "time-driver-any"]
}
embassy-executor = {
    version = "0.10.0",
    features = ["platform-cortex-m", "executor-thread", "executor-interrupt"]
}
embassy-time = {
    version = "0.5.1",
}
panic-halt = "1.0.0"

[[bin]]
name = "led-blink"
test = false
bench = false

[profile.dev]
lto = true
opt-level = "z"

[package.metadata.renode]
name = 'led-blnk'
description = 'renode script that shows how to blink an led'
machine-name = 'NUCLEO-F446RE'
using-sysbus = true
renode = 'renode'
platform-descriptions = [
    '@platforms/boards/stm32f4_discovery-kit.repl',
]
pre-start-commands = [
    'logLevel -1 gpioPortA.externalLed',
    'machine StartGdbServer 3333',
]
