[package]
name = "timer"
version = "0.1.0"
edition = "2024"
authors = ["Igor Akimov", "<igorakimy@gmail.com>"]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
panic-halt = "1.0"
embedded-hal = "1.0.0"
stm32f4xx-hal = {
    version = "0.23.0",
    features = ["stm32f446"]
}

[[bin]]
name = "timer"
test = false
bench = false

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "z"

[profile.dev]

[package.metadata.renode]
name = "timer"
description = "renode script that shows how to control timers"
machine-name = "NUCLEO-F446RE"
using-sysbus = true
renode = "renode"
platform-descriptions = [
    "@platforms/boards/stm32f4_discovery-kit.repl",
    "@breadboard.repl",
]
pre-start-commands = [
    "logLevel -1 gpioPortA.breadboardRedLED",
    "machine StartGdbServer 3333",
]